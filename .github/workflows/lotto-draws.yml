name: 로또 당첨번호 갱신

on:
  schedule:
    # 매주 토요일 추첨(20:45 KST) 후 21:10 KST = 12:10 UTC, 그리고 혹시 늦어질 때를 대비해 22:10 KST
    - cron: "10 12 * * 6"
    - cron: "10 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: main 체크아웃 (스크립트)
        uses: actions/checkout@v4
        with:
          path: src

      - name: gh-pages 체크아웃 (배포 파일)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: 당첨번호 받기
        run: python3 src/scripts/fetch_draws.py site/lotto/draws.json

      - name: 변경 있으면 커밋·푸시
        run: |
          cd site
          if git diff --quiet -- lotto/draws.json && [ -n "$(git ls-files lotto/draws.json)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "lotto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lotto/draws.json
          git commit -m "당첨번호 갱신 $(date -u +%Y-%m-%d)"
          git push origin gh-pages
